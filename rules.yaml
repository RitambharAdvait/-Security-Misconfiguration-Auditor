- rule_id: WIN-SEC-017
  category: Audit & Logging
  description: Ensure PowerShell Script Block Logging is enabled
  ps_command: Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
    -ErrorAction SilentlyContinue | Select-Object EnableScriptBlockLogging | ConvertTo-Json
