- rule_id: WIN-SEC-020
  category: Attack Surface
  description: Ensure Print Spooler service is stopped on non-print servers (PrintNightmare)
  ps_command: Get-Service -Name Spooler | Select-Object @{Name='Status';Expression={$_.Status.ToString()}}
    | ConvertTo-Json
  target_key: Status
  expected_value: Stopped
  severity: HIGH
  risk_explanation: The Windows Print Spooler service has a history of high-severity
    vulnerabilities (e.g. PrintNightmare CVE-2021-34527 / CVE-2021-1675) allowing
    remote code execution and local privilege escalation.
  remediation_command: '# Apply to non-print servers only. If this host requires local
    printing, leave enabled

    Stop-Service -Name Spooler -Force; Set-Service -Name Spooler -StartupType Disabled'
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 5.40
  mitre_tactic: Lateral Movement
  mitre_technique: T1210
  mitre_name: Exploitation of Remote Services
  enabled: true
  source: builtin
- rule_id: WIN-SEC-021
  category: Credential Access
  description: Ensure Credential Guard is enabled via Virtualization-Based Security
    (VBS)
  ps_command: Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\CredentialGuard'
    -ErrorAction SilentlyContinue | Select-Object Enabled | ConvertTo-Json
  target_key: Enabled
  expected_value: 1
  severity: CRITICAL
  risk_explanation: Credential Guard uses Virtualization-Based Security (VBS) to isolate
    and protect LSASS secrets (NTLM hashes, Kerberos tickets) inside a secure virtual
    container, neutralizing Mimikatz memory dumping even from local SYSTEM accounts.
  remediation_command: if (!(Test-Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\CredentialGuard'))
    { New-Item -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\CredentialGuard'
    -Force }; Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\CredentialGuard'
    -Name 'Enabled' -Value 1 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.8.22.1.13
  mitre_tactic: Credential Access
  mitre_technique: T1003.001
  mitre_name: LSASS Memory
  enabled: true
  source: builtin
- rule_id: WIN-SEC-022
  category: Credential Access
  description: Ensure LAN Manager (LM) hash storage is disabled in SAM database
  ps_command: Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -ErrorAction
    SilentlyContinue | Select-Object NoLMHash | ConvertTo-Json
  target_key: NoLMHash
  expected_value: 1
  severity: CRITICAL
  risk_explanation: LM hashes use weak DES encryption split into two 7-character chunks,
    allowing trivial brute-forcing with rainbow tables in seconds. Storing LM hashes
    enables immediate credential recovery from SAM.
  remediation_command: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    -Name 'NoLMHash' -Value 1 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 2.3.11.4
  mitre_tactic: Credential Access
  mitre_technique: T1003.002
  mitre_name: Security Account Manager
  enabled: true
  source: builtin
