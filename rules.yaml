    the local network.
  remediation_command: Disable-LocalUser -Name 'Guest'
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 2.3.1.3
  mitre_tactic: Persistence
  mitre_technique: T1078.003
  mitre_name: Local Accounts
  enabled: true
  source: builtin
- rule_id: WIN-SEC-006
  category: Network Security
  description: Ensure Windows Firewall is enabled for the Domain profile
  ps_command: Get-NetFirewallProfile -Name Domain | Select-Object Enabled | ConvertTo-Json
  target_key: Enabled
  expected_value: 1
  severity: HIGH
  risk_explanation: Disabling host-based firewalls for domain connections removes
    the first line of boundary defense against rogue endpoints, lateral network scans,
    and unauthorized service probing within corporate networks.
  remediation_command: Set-NetFirewallProfile -Name Domain -Enabled True
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 9.1.1
  mitre_tactic: Defense Evasion
  mitre_technique: T1562.004
  mitre_name: Disable or Modify System Firewall
  enabled: true
  source: builtin
- rule_id: WIN-SEC-007
  category: Credential Protection
  description: Ensure LSA Protection (RunAsPPL) is enabled to prevent credential dumping
  ps_command: Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' | Select-Object
    RunAsPPL | ConvertTo-Json
  target_key: RunAsPPL
  expected_value: 1
  severity: CRITICAL
  risk_explanation: Running the Local Security Authority (LSA) process as a Protected
    Process Light (PPL) prevents non-protected processes, even those with administrative
    privileges, from injecting code or dumping credentials (e.g., Mimikatz reading
    lsass.exe memory).
  remediation_command: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    -Name 'RunAsPPL' -Value 1 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.8.22.1.13
  mitre_tactic: Credential Access
  mitre_technique: T1003.001
  mitre_name: LSASS Memory
  enabled: true
  source: builtin
- rule_id: WIN-SEC-008
  category: Execution Policy
  description: Ensure PowerShell script execution policy is restricted
  ps_command: Get-ExecutionPolicy | Select-Object @{Name='ExecutionPolicy';Expression={$_}}
    | ConvertTo-Json
  target_key: ExecutionPolicy
  expected_value: AllSigned
  severity: MEDIUM
  risk_explanation: An unrestricted PowerShell execution policy permits execution
    of unverified, downloaded scripts. Enforcing signed script execution or at least
    RemoteSigned prevents drive-by or downloaded malicious script execution.
  remediation_command: '# CIS allows RemoteSigned; AllSigned is stricter but can break
    local dev scripts

    Set-ExecutionPolicy -Scope LocalMachine -ExecutionPolicy RemoteSigned -Force'
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.107.2.2
  mitre_tactic: Execution
  mitre_technique: T1059.001
  mitre_name: PowerShell
  enabled: true
  source: builtin
- rule_id: WIN-SEC-009
  category: Patch Management
  description: Ensure Automatic Updates are not disabled via policy
  ps_command: Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    -ErrorAction SilentlyContinue | Select-Object NoAutoUpdate | ConvertTo-Json
  target_key: NoAutoUpdate
  expected_value: 0
  severity: MEDIUM
  risk_explanation: Disabling automatic updates prevents timely patching of critical
    zero-day vulnerabilities and OS security flaws, exposing the platform to known
    exploits documented in NVD/CVE databases.
  remediation_command: Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    -Name 'NoAutoUpdate' -Value 0 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.102.1.1
  mitre_tactic: Defense Evasion
  mitre_technique: T1562.001
  mitre_name: Disable or Modify Tools
  enabled: true
  source: builtin
- rule_id: WIN-SEC-010
  category: Data Protection
  description: Ensure BitLocker is fully encrypting the system drive (C:)
  ps_command: Get-BitLockerVolume -MountPoint 'C:' | Select-Object VolumeStatus |
    ConvertTo-Json
  target_key: VolumeStatus
  expected_value: FullyEncrypted
  severity: HIGH
  risk_explanation: Unencrypted volumes expose all host data, user credentials, and
    offline registry hives (SAM, SYSTEM) to physical theft, offline attacks, or malicious
    live booting.
  remediation_command: Enable-BitLocker -MountPoint 'C:' -EncryptionMethod XtsAes256
    -UsedSpaceOnly -TpmProtector
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.8.3
  mitre_tactic: Defense Evasion
  mitre_technique: T1140
  mitre_name: Deobfuscate/Decode Files or Information
  enabled: true
  source: builtin
- rule_id: WIN-SEC-011
  category: Privilege Escalation
  description: Ensure AlwaysInstallElevated is disabled (HKLM) — prevents SYSTEM-level
    MSI install abuse
  ps_command: Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    -ErrorAction SilentlyContinue | Select-Object AlwaysInstallElevated | ConvertTo-Json
  target_key: AlwaysInstallElevated
  expected_value: 0
  severity: CRITICAL
  risk_explanation: When AlwaysInstallElevated is set to 1 in HKLM, Windows Installer
    executes all MSI packages with NT AUTHORITY\SYSTEM privileges, allowing standard
    unprivileged users to craft a malicious MSI package and immediately gain full
    root/SYSTEM control.
  remediation_command: Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    -Name 'AlwaysInstallElevated' -Value 0 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.86.1
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548.002
  mitre_name: Bypass User Account Control
  enabled: true
  source: builtin
- rule_id: WIN-SEC-012
  category: Privilege Escalation
  description: Ensure AlwaysInstallElevated is disabled (HKCU)
  ps_command: Get-ItemProperty 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    -ErrorAction SilentlyContinue | Select-Object AlwaysInstallElevated | ConvertTo-Json
  target_key: AlwaysInstallElevated
  expected_value: 0
  severity: CRITICAL
  risk_explanation: AlwaysInstallElevated in HKCU must also be 0; if enabled in conjunction
    with HKLM, standard users can trigger elevated MSI installations from their own
    user registry hive.
  remediation_command: Set-ItemProperty -Path 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    -Name 'AlwaysInstallElevated' -Value 0 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.86.2
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548.002
  mitre_name: Bypass User Account Control
  enabled: true
  source: builtin
- rule_id: WIN-SEC-013
  category: Credential Protection
  description: Ensure WDigest does not cache plaintext credentials in memory
  ps_command: Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    -ErrorAction SilentlyContinue | Select-Object UseLogonCredential | ConvertTo-Json
  target_key: UseLogonCredential
  expected_value: 0
  severity: CRITICAL
  risk_explanation: When UseLogonCredential is enabled (1), WDigest retains plaintext
    passwords in LSASS memory for digest authentication, allowing attackers with administrative
    access or memory inspection tools to extract cleartext passwords directly.
  remediation_command: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'
    -Name 'UseLogonCredential' -Value 0 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.8.22.1.1
  mitre_tactic: Credential Access
  mitre_technique: T1003.001
  mitre_name: LSASS Memory
  enabled: true
  source: builtin
- rule_id: WIN-SEC-014
  category: Network Security
  description: Ensure LLMNR (Link-Local Multicast Name Resolution) is disabled to
    prevent spoofing
  ps_command: Get-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    -ErrorAction SilentlyContinue | Select-Object EnableMulticast | ConvertTo-Json
  target_key: EnableMulticast
  expected_value: 0
  severity: HIGH
  risk_explanation: LLMNR allows unauthenticated multicast name queries on local subnets.
    Attackers on the same network use tools like Responder to poison LLMNR responses,
    tricking victims into sending NTLMv2 password hashes.
  remediation_command: if (!(Test-Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows
    NT\DNSClient')) { New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    -Force }; Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'
    -Name 'EnableMulticast' -Value 0 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.30.2
  mitre_tactic: Credential Access
  mitre_technique: T1557.001
  mitre_name: LLMNR/NBT-NS Poisoning and SMB Relay
  enabled: true
  source: builtin
- rule_id: WIN-SEC-015
