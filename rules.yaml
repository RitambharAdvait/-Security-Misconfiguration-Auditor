  category: Credential Access
  description: Ensure NTLM authentication minimum protocol is set to NTLMv2 only (refuse
    LM & NTLM)
  ps_command: Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -ErrorAction
    SilentlyContinue | Select-Object LmCompatibilityLevel | ConvertTo-Json
  target_key: LmCompatibilityLevel
  expected_value: 5
  severity: CRITICAL
  risk_explanation: Setting LmCompatibilityLevel to 5 enforces 'Send NTLMv2 response
    only. Refuse LM & NTLM', preventing downgrade attacks, credential relay, and replay
    attacks on legacy authentication handshakes.
  remediation_command: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    -Name 'LmCompatibilityLevel' -Value 5 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 2.3.11.7
  mitre_tactic: Credential Access
  mitre_technique: T1557.001
  mitre_name: LLMNR/NBT-NS Poisoning and SMB Relay
  enabled: true
  source: builtin
