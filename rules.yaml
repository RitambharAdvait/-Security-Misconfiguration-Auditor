  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.13.1
  mitre_tactic: Initial Access
  mitre_technique: T1091
  mitre_name: Replication Through Removable Media
  enabled: true
  source: builtin
- rule_id: WIN-SEC-016
  category: Endpoint Hardening
