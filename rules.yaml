  ps_command: Get-SmbClientConfiguration | Select-Object RequireSecuritySignature
    | ConvertTo-Json
  target_key: RequireSecuritySignature
  expected_value: true
  severity: HIGH
  risk_explanation: Unsigned SMB traffic is vulnerable to Man-in-the-Middle (MitM)
