- rule_id: WIN-SEC-001
  category: Lateral Movement
  description: Ensure SMBv1 protocol is disabled (used by WannaCry/EternalBlue)
  ps_command: Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol | ConvertTo-Json
  target_key: EnableSMB1Protocol
  expected_value: false
  severity: CRITICAL
  risk_explanation: SMBv1 is an insecure, legacy protocol vulnerable to remote code
    execution exploits like EternalBlue (used in the WannaCry ransomware attack).
    It lacks modern encryption and pre-authentication integrity checks.
  remediation_command: Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.3.4
  mitre_tactic: Lateral Movement
  mitre_technique: T1021.002
  mitre_name: SMB/Windows Admin Shares
  enabled: true
  source: builtin
- rule_id: WIN-SEC-002
  category: Privilege Escalation
  description: Ensure User Account Control (UAC) is enabled
  ps_command: Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    | Select-Object EnableLUA | ConvertTo-Json
  target_key: EnableLUA
  expected_value: 1
  severity: HIGH
  risk_explanation: Disabling UAC allows standard users and processes to silently
    elevate privileges and modify sensitive system files, registry entries, and core
    operating system configurations without administrative prompts.
  remediation_command: Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    -Name 'EnableLUA' -Value 1 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 2.3.17.1
  mitre_tactic: Privilege Escalation
  mitre_technique: T1548.002
  mitre_name: Bypass User Account Control
  enabled: true
  source: builtin
- rule_id: WIN-SEC-003
  category: Remote Access
  description: Ensure RDP requires Network Level Authentication (NLA)
  ps_command: Get-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    | Select-Object UserAuthentication | ConvertTo-Json
  target_key: UserAuthentication
  expected_value: 1
  severity: HIGH
  risk_explanation: Disabling Network Level Authentication (NLA) allows unauthenticated
    remote attackers to initiate RDP sessions before presenting credentials, exposing
    systems to credential brute-forcing, Denial of Service, and unauthenticated RCE
    exploits (e.g., BlueKeep CVE-2019-0708).
  remediation_command: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal
    Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Type DWord
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.60.2
  mitre_tactic: Lateral Movement
  mitre_technique: T1021.001
  mitre_name: Remote Desktop Protocol
  enabled: true
  source: builtin
- rule_id: WIN-SEC-004
  category: Defense Evasion
  description: Ensure Windows Defender Real-Time Protection is active
  ps_command: Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled | ConvertTo-Json
  target_key: RealTimeProtectionEnabled
  expected_value: true
  severity: CRITICAL
  risk_explanation: Disabling Defender real-time protection permits malware execution,
    malicious memory injections, and script-based droppers to run completely unhindered
    and undetected.
  remediation_command: Set-MpPreference -DisableRealtimeMonitoring $false
  cis_reference: CIS Microsoft Windows 11 v2.0.0 - 18.9.46.4.1
  mitre_tactic: Defense Evasion
  mitre_technique: T1562.001
  mitre_name: Disable or Modify Tools
  enabled: true
  source: builtin
- rule_id: WIN-SEC-005
  category: Credential Protection
  description: Ensure built-in Guest account is disabled
  ps_command: Get-LocalUser -Name 'Guest' | Select-Object Enabled | ConvertTo-Json
  target_key: Enabled
  expected_value: false
  severity: MEDIUM
  risk_explanation: An active Guest account provides anonymous local logon capability
